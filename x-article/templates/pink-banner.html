<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Caveat:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1500px;height:600px;overflow:hidden;position:relative;font-family:Nunito,Helvetica,sans-serif;color:#3b2140;
background:linear-gradient(120deg,#ffe4ec 0%,#fbe3f4 45%,#e9e1ff 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(2px)}
.b1{width:420px;height:420px;left:-120px;bottom:-200px;background:#ffc7d9;opacity:.6}
.b2{width:520px;height:520px;right:-140px;top:-220px;background:#d9ccff;opacity:.6}
.spark{position:absolute;color:#ff7fa8;font-size:34px}
.left{position:absolute;left:96px;top:0;bottom:0;width:720px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.note{font:700 38px Caveat,cursive;color:#c2457a;transform:rotate(-2deg);transform-origin:left}
h1{font-family:Fraunces,Georgia,serif;font-weight:900;font-size:78px;line-height:1.02;letter-spacing:-.01em;color:#3b2140}
h1 .hl{background:linear-gradient(transparent 58%,#ffb3cb 58%,#ffb3cb 92%,transparent 92%);padding:0 6px;margin:0 -6px}
.sub{font-weight:600;font-size:25px;color:#7a5a80}
.right{position:absolute;right:96px;top:50%;transform:translateY(-50%);width:500px;height:440px}
.post{position:absolute;left:0;top:30px;width:460px;background:#fff;border-radius:28px;padding:26px 28px;box-shadow:0 18px 40px -18px #b0507a55;transform:rotate(-2deg)}
.who{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ff9ebd,#b9a3ff)}
.who b{font-weight:800;font-size:18px}
.who span{display:block;font-size:15px;color:#a58aa9}
.q{font:700 36px Fraunces,Georgia,serif;color:#3b2140;white-space:nowrap}
.stats{margin-top:14px;font-weight:800;font-size:17px;color:#c2457a;display:flex;gap:18px}
.r{position:absolute;background:#fff;border-radius:999px;padding:10px 20px;font-weight:800;font-size:20px;box-shadow:0 10px 24px -14px #b0507a66}
.r1{right:0;top:250px;transform:rotate(3deg)}
.r2{right:150px;top:312px;transform:rotate(-2deg)}
.r3{right:10px;top:372px;transform:rotate(2deg)}
.sticker{position:absolute;right:-6px;top:-8px;background:#3b2140;color:#fff;border-radius:22px;padding:14px 20px;transform:rotate(6deg);text-align:center;box-shadow:0 14px 30px -14px #3b214099}
.sticker .n{font:900 34px Fraunces,Georgia,serif;letter-spacing:-.01em}
.sticker .n em{font-style:normal;color:#ff9ebd;margin:0 6px}
.sticker .c{font:700 22px Caveat,cursive;color:#ffc7d9}
.plus{font-family:Nunito,sans-serif;font-weight:800}</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="spark" style="left:60px;top:70px">✦</div>
<div class="spark" style="left:820px;top:470px;font-size:24px;color:#b39cff">✦</div>
<div class="spark" style="left:900px;top:90px;font-size:22px">✦</div>
<div class="left">
<div class="note">my first day on X ✨</div>
<h1>How I Grew <span class="hl">500<span class="plus">+</span> Followers</span> in One Day on X</h1>
<div class="sub">The loop that worked, and what it actually buys you.</div>
</div>
<div class="right">
<div class="post">
<div class="who"><div class="av"></div><div><b>Luna</b><span>@lunaxxvelvet</span></div></div>
<div class="q">Can I follow you? 😊</div>
<div class="stats"><span>165 replies</span><span>150 likes</span><span>4,611 views</span></div>
</div>
<div class="r r1">Followed ❤️</div>
<div class="r r2">Done 💜</div>
<div class="r r3">yes! let's connect 🙏</div>
<div class="sticker"><div class="n">78<em>→</em>607</div><div class="c">followers in 25 hours</div></div>
</div>
</body></html>
