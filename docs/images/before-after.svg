<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="960" height="400" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="959" height="399" rx="16" fill="none" stroke="#d0d7de"/>

  <!-- Before -->
  <text x="40" y="52" font-size="15" font-weight="700" fill="#cf222e" letter-spacing="1.5">WHAT YOUR LOGS SAY</text>
  <rect x="40" y="72" width="400" height="280" rx="10" fill="#0d1117"/>
  <circle cx="62" cy="92" r="6" fill="#ff5f57"/><circle cx="82" cy="92" r="6" fill="#febc2e"/><circle cx="102" cy="92" r="6" fill="#28c840"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
    <text x="60" y="140" fill="#8b949e">02:13:57 <tspan fill="#c9d1d9">loading config</tspan></text>
    <text x="60" y="166" fill="#8b949e">02:13:58 <tspan fill="#c9d1d9">processing order 1234</tspan></text>
    <text x="60" y="192" fill="#8b949e">02:13:58 <tspan fill="#c9d1d9">calculating total</tspan></text>
    <text x="60" y="236" fill="#6e7681">…</text>
    <text x="60" y="290" fill="#ff7b72">Segmentation fault (core dumped)</text>
    <text x="60" y="318" fill="#6e7681">no error. no stack trace. nothing.</text>
  </g>

  <!-- Arrow -->
  <path d="M458 212 H500" stroke="#8250df" stroke-width="3" fill="none"/>
  <path d="M498 202 L514 212 L498 222 Z" fill="#8250df"/>

  <!-- After -->
  <text x="528" y="52" font-size="15" font-weight="700" fill="#1a7f37" letter-spacing="1.5">WHAT CRASHLENS SAYS</text>
  <rect x="528" y="72" width="392" height="280" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="552" y="116" font-size="19" font-weight="700" fill="#1f2328">NULL pointer dereference</text>
  <text x="552" y="144" font-size="15" fill="#57606a">in <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#1f2328">sum+0x31</tspan>, called from <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#1f2328">main</tspan></text>
  <line x1="552" y1="164" x2="896" y2="164" stroke="#d0d7de"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#1f2328">
    <text x="552" y="194">=&gt; mov (%rax),%eax</text>
    <text x="552" y="220">rax = 0x0 <tspan fill="#cf222e">← NULL</tspan></text>
  </g>
  <line x1="552" y1="240" x2="896" y2="240" stroke="#d0d7de"/>
  <text x="552" y="270" font-size="14" fill="#1f2328">☐ find where the pointer is assigned</text>
  <text x="552" y="296" font-size="14" fill="#1f2328">☐ add a NULL check at the producer</text>
  <text x="552" y="332" font-size="12.5" fill="#57606a">evidence: core + binary sha256 · program never executed</text>
</svg>
