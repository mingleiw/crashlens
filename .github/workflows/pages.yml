name: Demo site

# Builds the in-browser demo (site/) and publishes it to the gh-pages branch,
# which GitHub Pages serves at https://<owner>.github.io/crashlens/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Builds the site and checks the browser bundle against Node on every fixture.
      - run: npm run build:site
      - name: Publish to the gh-pages branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd site/dist
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Deploy demo from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
